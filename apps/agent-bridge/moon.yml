$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'application'

tasks:
  dev:
    command: 'bun run dev'
    options:
      runInCI: false

  build:
    command: 'bun run build'
    inputs:
      - 'src/**/*'
      - 'package.json'
      - 'tsconfig.json'
    outputs:
      - 'dist'

  test:
    command: 'bun run test'
    inputs:
      - 'src/**/*'
      - 'test/**/*'
      - 'tsconfig.json'

  typecheck:
    command: 'bun run typecheck'
    inputs:
      - 'src/**/*'
      - 'test/**/*'
      - 'scripts/**/*'
      - 'tsconfig.json'
